[workspace]
members = [
    "crates/repo-snapshot",
    "crates/macdiag-json",
    "crates/codex-history",
]
resolver = "2"

[workspace.package]
edition = "2024"
repository = "https://github.com/gudcks0305/useful-cli-command"
rust-version = "1.89"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
