---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l ./cmd ./internal ./pkg)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Validate agent skill installer
        run: |
          sh -n scripts/install-skill.sh
          export AGENTS_SKILLS_DIR="$RUNNER_TEMP/agents-skills"
          export CLAUDE_SKILLS_DIR="$RUNNER_TEMP/claude-skills"
          sh scripts/install-skill.sh
          sh scripts/install-skill.sh
          test -s "$AGENTS_SKILLS_DIR/useful-cli/SKILL.md"
          test "$CLAUDE_SKILLS_DIR/useful-cli" -ef "$AGENTS_SKILLS_DIR/useful-cli"

  rust:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: >-
          rustup toolchain install 1.89.0
          --profile minimal
          --component rustfmt,clippy
      - run: cargo +1.89.0 fmt --all --check
      - run: >-
          cargo +1.89.0 clippy --workspace --all-targets -- -D warnings
      - run: cargo +1.89.0 test --workspace
